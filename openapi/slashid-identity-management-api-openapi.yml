                  properties:
                    result:
                      $ref: '#/components/schemas/WebhookPatchResponse'
                  required:
                  - result
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: DeleteOrganizationsWebhooksWebhookId
      x-rbac-enabled: true
      x-rbac-allowed-groups: admin
