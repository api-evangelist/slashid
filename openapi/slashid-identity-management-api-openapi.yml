      x-rbac-enabled: true
      x-rbac-allowed-groups: admin
      tags:
      - Identity Management
      summary: Create a webhook trigger
      description: 'Create a new trigger for an existing webhook. Each webhook can have multiple triggers, and will be called

        on each of them.


        The trigger type specifies what kind of trigger will cause the webhook to be called. The trigger name specifies

        the exact trigger that will cause the webhook to be called, amongst all triggers of this type. For a full list

        of trigger types and names, refer to our [webhooks guide](/docs/access/guides/webhooks).

        '
      parameters:
      - $ref: '#/components/parameters/RequiredConsistencyHeader'
      - $ref: '#/components/parameters/RequiredConsistencyTimeoutHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTriggerPostRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseBase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: DeleteOrganizationsWebhooksWebhookIdTriggers
      x-rbac-enabled: true
      x-rbac-allowed-groups: admin
      tags:
      - Identity Management
      summary: Delete a webhook trigger
      description: 'Delete a trigger for a specific webhook. The webhook will no longer be called on this trigger.

        Note that for a short period after the delete request has successfully returned, triggers in flight may still cause the webhook to be called.

        '
      parameters:
      - $ref: '#/components/parameters/RequiredConsistencyHeader'
      - $ref: '#/components/parameters/RequiredConsistencyTimeoutHeader'
      - $ref: '#/components/parameters/WebhookTriggerTypeQueryParam'
      - $ref: '#/components/parameters/WebhookTriggerNameQueryParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/webhooks/verification-jwks:
    parameters:
    - $ref: '#/components/parameters/OrgIDHeader'
    get:
      operationId: GetOrganizationsWebhooksVerificationJwks
      x-rbac-enabled: true
      x-rbac-allowed-groups: admin,member
      tags:
      - Identity Management
      summary: Retrieve verification JWKS for webhooks
      description: 'Endpoint to retrieve a JSON Web Key Set (JWKS) for webhook body verification.

        When SlashID calls your webhooks in response to a trigger, the body of the request is a signed and encoded JSON Web Token (JWT). The public part of the signing key can be retrieved from this endpoint and used to verify that the request body comes from SlashID, is intended for your webhook, and has not been modified.

        SlashID uses the ES256 JSON Web Algorithm (JWA), which is the Elliptic Curve Digital Signature Algorithm (ECDSA) with the P-256 curve and SHA256.

        Support for JWTs and JWKS is available for many languages - [jwt.io](https://jwt.io/libraries) maintains an extensive (but not exhaustive) list of libraries for popular languages.

        Note that this endpoint is rate-limited to 30 requests per minute per organization, with bursts of 60. It is therefore recommended that you cache the keyset locally in your webhook handlers.

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
  /oauth2/clients:
    parameters:
    - $ref: '#/components/parameters/OrgIDHeader'
    post:
      operationId: PostOauth2Clients
      x-rbac-enabled: true
      x-rbac-allowed-groups: admin
      tags:
      - Identity Management
      summary: Create a new OAuth2 client
      description: 'Create a new client ID/secret pair that can be used with the client credentials grant type.

        A valid SlashID organization ID and API key must be used to authenticate and authorize the request.

        The client credentials can be configured.


        SlashID currently supports the following OAuth 2.0 grants:

        - client credentials

        - authorization code

        - refresh token

        The `grant_types` field may contain only the values `client_credentials` and `authorization_code`.

        Other values will return a `400` error code.


        The client credentials grant requires a client secret, and so all clients allowing that grant should be regarded

        as confidential, as defined in the OAuth 2.0 specification (https://oauth.net/2/client-types/).


        The response body will include the client ID and client secret.

        For the client credentials grant, these can be used with the `/oauth2/tokens` endpoints to obtain an access token.

        For the authorization code grant, these can be used as described in the [OAuth 2.0 specification](https://datatracker.ietf.org/doc/html/rfc6749).

        The client secret must be stored securely, and cannot be retrieved in

        subsequent API calls. If you lose the client secret, a new secret can be generated using the

        `PUT /oauth2/clients/{oauth_client_id}/secret` endpoint.'
      parameters:
      - $ref: '#/components/parameters/RequiredConsistencyHeader'
      - $ref: '#/components/parameters/RequiredConsistencyTimeoutHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostOAuth2ClientRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponseBase'
                - type: object
                  required:
                  - result
                  properties:
                    result:
                      $ref: '#/components/schemas/OAuth2ClientWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: GetOauth2Clients
      x-rbac-enabled: true
      x-rbac-allowed-groups: admin,member
      tags:
      - Identity Management
      summary: Retrieve a list of OAuth2 clients
      description: 'Retrieve a list of existing OAuth 2.0 clients for your organization.

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/APIResponseBase'
                - type: object
                  required:
                  - result
                  properties:
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/OAuth2Client'
        '400':
          $ref: '#/components/responses/BadRequest'
  /oauth2/clients/{oauth_client_id}:
    parameters:
    - $ref: '#/components/parameters/OrgIDHeader'
    - $ref: '#/components/parameters/OAuthClientIDPathParam'
    get:
      operationId: GetOauth2ClientsOauthClientId
      x-rbac-enabled: true
      x-rbac-allowed-groups: admin,member
      tags:
      - Identity Management
      summary: Retrieve an OAuth2 client
      description: 'Get details on the identified client. Authenticated with a SlashID organization ID and API key; the organization ID must match or be a parent of the client owner.

        '
      responses:
        '200':
